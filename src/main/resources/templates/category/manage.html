<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>카테고리 관리</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/document.css}">
</head>
<body>

<div th:replace="~{fragment/header :: header}"></div>

<div class="app-body">
    <div th:if="${errorMessage}" class="badge badge-danger" style="display:block; padding:10px; margin-bottom:14px;">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="cat-mgmt-layout" style="display:grid; grid-template-columns:1fr 340px; gap:16px; align-items:start;">

        <!-- 카테고리 테이블 -->
        <div>
            <div class="section-label" style="margin-bottom:12px;">카테고리 목록</div>

            <div class="tbl-wrap">
                <table>
                    <thead>
                    <tr>
                        <th style="width:40px;">ID</th>
                        <th>카테고리명</th>
                        <th style="width:110px;">상위 카테고리</th>
                        <th style="width:90px; text-align:center;">관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cat : ${categories}">
                        <td class="text-hint" th:text="${cat.id}"></td>
                        <td th:text="${cat.parent == null} ? '📁 ' + ${cat.name} : '└ ' + ${cat.name}"
                            th:class="${cat.parent != null} ? 'cat-indent text-muted' : ''"></td>
                        <td>
                            <span th:if="${cat.parent != null}" class="badge badge-gray" style="font-size:10px;" th:text="${cat.parent.name}"></span>
                            <span th:if="${cat.parent == null}" class="text-hint">—</span>
                        </td>
                        <td style="text-align:center;">
                            <form th:action="@{/categories/{id}/delete(id=${cat.id})}" method="post"
                                  onsubmit="return confirm('삭제하시겠습니까?')" style="display:inline;">
                                <button type="submit" class="act-btn">삭제</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 태그 관리 사이드바 -->
        <div class="card" style="margin-bottom:0;">
            <div class="card-title">태그 관리</div>
            <div class="tbl-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>태그명</th>
                        <th style="width:52px; text-align:center;">삭제</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="tag : ${tags}">
                        <td><span class="badge badge-gray" th:text="${tag.name}"></span></td>
                        <td style="text-align:center;">
                            <form th:action="@{/tags/{name}/delete(name=${tag.name})}" method="post"
                                  onsubmit="return confirm('삭제하시겠습니까?')" style="display:inline;">
                                <button type="submit" class="act-btn">×</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

</body>
</html>
