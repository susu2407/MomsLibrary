<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>카테고리 관리</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/document.css}">
</head>
<body>

<div th:replace="~{fragment/header :: header(active='categories')}"></div>

<div class="app-body">
    <div th:if="${errorMessage}" class="badge badge-danger" style="display:block; padding:10px; margin-bottom:14px;">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="cat-mgmt-layout" style="display:grid; grid-template-columns:1fr 340px; gap:16px; align-items:start;">

        <!-- 카테고리 테이블 -->
        <div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <div class="section-label" style="margin:0;">카테고리 목록</div>
                <a th:href="@{/categories/new}" class="btn-primary" style="font-size:12px; padding:7px 13px; text-decoration:none;">+ 카테고리 추가</a>
            </div>

            <div class="tbl-wrap">
                <table>
                    <thead>
                    <tr>
                        <th style="width:40px;">ID</th>
                        <th>카테고리명</th>
                        <th style="width:110px;">상위 카테고리</th>
                        <th style="width:100px; text-align:center;">관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <th:block th:each="cat : ${categories}" th:if="${cat.parent == null}">
                        <tr>
                            <td class="text-hint" th:text="${cat.id}"></td>
                            <td style="font-weight:500;" th:text="'📁 ' + ${cat.name}"></td>
                            <td class="text-hint">—</td>
                            <td style="text-align:center;">
                                <div style="display:flex; gap:4px; justify-content:center;">
                                    <a th:href="@{/categories/{id}/edit(id=${cat.id})}" class="act-btn" style="text-decoration:none;">수정</a>
                                    <form th:action="@{/categories/{id}/delete(id=${cat.id})}" method="post"
                                          onsubmit="return confirm('삭제하시겠습니까?')" style="display:inline;">
                                        <button type="submit" class="act-btn">삭제</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:each="sub : ${categories}" th:if="${sub.parent != null and sub.parent.id == cat.id}">
                            <td class="text-hint" th:text="${sub.id}"></td>
                            <td class="cat-indent text-muted" th:text="'└ ' + ${sub.name}"></td>
                            <td><span class="badge badge-gray" style="font-size:10px;" th:text="${cat.name}"></span></td>
                            <td style="text-align:center;">
                                <div style="display:flex; gap:4px; justify-content:center;">
                                    <a th:href="@{/categories/{id}/edit(id=${sub.id})}" class="act-btn" style="text-decoration:none;">수정</a>
                                    <form th:action="@{/categories/{id}/delete(id=${sub.id})}" method="post"
                                          onsubmit="return confirm('삭제하시겠습니까?')" style="display:inline;">
                                        <button type="submit" class="act-btn">삭제</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </th:block>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 태그 관리 사이드바 -->
        <div class="card" style="margin-bottom:0;">
            <div class="card-title">태그 관리</div>
            <div class="tag-input-wrap">
                <form th:action="@{/tags/new}" method="post" style="display:flex; gap:6px; width:100%;">
                    <input type="text" name="name" placeholder="새 태그 이름..." required
                           style="flex:1; padding:7px 10px; border:0.5px solid var(--border-medium); border-radius:var(--radius-md); background:var(--bg-primary); color:var(--text-primary); font-family:var(--font); font-size:13px; outline:none;">
                    <button type="submit" class="btn-primary" style="font-size:12px; padding:7px 11px;">추가</button>
                </form>
            </div>
            <div class="tbl-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>태그명</th>
                        <!-- <th style="width:52px; text-align:center;">사용 수</th> -->
                        <th style="width:52px; text-align:center;">삭제</th>
                    </tr>
                    </thead>
                    <tbody id="tagTbody">
                    <tr th:each="tag : ${tags}">
                        <td><span class="badge badge-gray" th:text="${tag.name}"></span></td>
                        <!-- <td style="text-align:center; font-size:12px; color:var(--text-secondary);">사용 개수, (리팩토리)</td> -->
                        <td style="text-align:center;">
                            <form th:action="@{/tags/{name}/delete(name=${tag.name})}" method="post"
                                  onsubmit="return confirm('삭제하시겠습니까?')" style="display:inline;">
                                <button type="submit" class="act-btn">×</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

</body>
</html>
