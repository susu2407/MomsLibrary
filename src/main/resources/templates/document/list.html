<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>자료 목록</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/document.css}">
</head>
<body>
<div th:replace="~{fragment/header :: header(active='documents')}"></div>

<div class="app-body">
    <div th:if="${errorMessage}" class="badge badge-danger" style="display:block; padding:10px; margin-bottom:14px;">
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- 지표 카드 - 일단 하드코딩, 나중에 연결 -->
    <div class="metric-grid">
        <div class="metric">
            <div class="metric-lbl">전체 자료</div>
            <div class="metric-val" th:text="${documents.size()}">0</div>
        </div>
        <div class="metric">
            <div class="metric-lbl">이번 달 등록</div>
            <div class="metric-val">-</div>
        </div>
        <div class="metric">
            <div class="metric-lbl">독서 완료</div>
            <div class="metric-val">-</div>
        </div>
        <div class="metric">
            <div class="metric-lbl">카테고리 수</div>
            <div class="metric-val">-</div>
        </div>
    </div>

    <!-- 툴바 -->
    <div class="toolbar">
        <input type="text" id="searchInput" placeholder="제목, 저자, 출판사 검색...">
        <select id="filterCat" onchange="filterTable()">
            <option value="">전체 카테고리</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
        </select>
        <select id="filterTag" onchange="filterTable()">
            <option value="">전체 태그</option>
            <option th:each="tag : ${tags}" th:value="${tag.id}" th:text="${tag.name}"></option>
        </select>
        <a th:href="@{/documents/new}" class="btn-primary" style="text-decoration:none;">+ 자료 등록</a>
    </div>

    <!-- 테이블 -->
    <div class="tbl-wrap">
        <table>
            <thead>
            <tr>
                <th style="width:220px">제목</th>
                <th style="width:120px">카테고리</th>
                <th style="width:120px">저자</th>
                <th style="width:120px">출판사</th>
                <th style="width:120px">독서 시기</th>
                <th>태그</th>
                <th style="width:250px">한 줄 감상</th>
            </tr>
            </thead>
            <tbody>

            <!-- 데이터 없을 때 -->
            <tr th:if="${documents.isEmpty()}">
                <td colspan="8" style="text-align:center; padding:40px; color:var(--text-secondary)">
                    등록된 자료가 없습니다.
                </td>
            </tr>

            <!-- 데이터 있을 때 - DB에서 받아온 documents 리스트 반복 -->
            <tr th:each="doc : ${documents}" th:unless="${documents.isEmpty()}">
                <td>
                    <!-- 제목 클릭하면 상세 페이지로 이동 -->
                    <a th:href="@{/documents/{id}(id=${doc.id})}"
                       th:text="${doc.title}"
                       style="font-weight:500; color:var(--text-info); text-decoration:none;">
                    </a>
                </td>
                <td>
                    <span class="badge badge-gray"
                          th:text="${doc.categoryName ?: '-'}">
                    </span>
                </td>
                <td th:text="${doc.author} ?: '-'" class="ellipsis"></td>
                <td th:text="${doc.publisher} ?: '-'" class="ellipsis"></td>
                <td th:text="${doc.readAt} ?: '-'" class="text-muted"></td>
                <td>
                    <span th:each="tagName : ${doc.tagNames}" class="badge badge-gray" th:text="${tagName}"></span>
                </td>
                <td th:text="${doc.memo} ?: '-'"
                    class="ellipsis"
                    style="font-size:12px; color:var(--text-secondary)">
                </td>
            </tr>

            </tbody>
        </table>
    </div>

</div>

<script th:src="@{/js/document-list.js}"></script>
</body>
</html>
