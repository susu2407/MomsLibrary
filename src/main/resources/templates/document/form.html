<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${mode == 'register'} ? '자료 등록' : '자료 수정'">자료 폼</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/document.css}">
</head>
<body>
 
<div th:replace="~{fragment/header :: header}"></div>
 
<div class="app-body">
 
    <div class="breadcrumb">
        <a th:href="@{/documents}" class="link" style="text-decoration:none;">목록</a>
        <span class="bc-sep">/</span>
        <span th:text="${mode == 'register'} ? '자료 등록' : '자료 수정'"></span>
    </div>
 
    <form th:action="${mode == 'register'} ?
                      @{/documents/new} :
                      @{/documents/{id}/edit(id=${document.id})}"
          th:object="${document}"
          method="post">
 
        <div style="display:grid; grid-template-columns:1fr 300px;
                    gap:16px; align-items:start;">
 
            <!-- 왼쪽 폼 -->
            <div class="card" style="margin-bottom:0;">
 
                <div class="form-section-title">기본 정보</div>
                <div class="form-grid">
 
                    <div class="form-group full">
                        <label>제목 <span class="req">*</span></label>
                        <input type="text" th:field="*{title}"
                               placeholder="자료 제목을 입력하세요">
                        <span th:if="${#fields.hasErrors('title')}"
                              th:errors="*{title}"
                              style="color:var(--text-danger); font-size:12px;"></span>
                    </div>
 
                    <div class="form-group">
                        <label>분류 (카테고리) <span class="req">*</span></label>
                        <select th:field="*{categoryId}" id="regCategory">
                            <option value="">카테고리 선택</option>
 
                            <!-- 상위 카테고리 (parent가 null인 것) -->
                            <th:block th:each="cat : ${categories}"
                                      th:if="${cat.parent == null}">
 
                                <!-- 상위 카테고리 자체도 선택 가능 -->
                                <option th:value="${cat.id}"
                                        th:text="${cat.name}"></option>
 
                                <!-- 하위 카테고리 : 상위명 / 하위명 형식 -->
                                <option th:each="sub : ${categories}"
                                        th:if="${sub.parent != null and sub.parent.id == cat.id}"
                                        th:value="${sub.id}"
                                        th:text="${cat.name + ' / ' + sub.name}"></option>
                            </th:block>
                        </select>
                        <span th:if="${#fields.hasErrors('categoryId')}"
                              th:errors="*{categoryId}"
                              style="color:var(--text-danger); font-size:12px;"></span>
                    </div>
 
                    <div class="form-group">
                        <label>저자 / 작성자</label>
                        <input type="text" th:field="*{author}"
                               placeholder="저자명">
                    </div>
 
                    <div class="form-group">
                        <label>출판사</label>
                        <input type="text" th:field="*{publisher}"
                               placeholder="출판사 또는 매체명">
                    </div>
 
                    <div class="form-group">
                        <label>출판 / 게시 시기</label>
                        <input type="text" th:field="*{publishedAt}"
                               placeholder="예: 2024.03">
                    </div>
 
                    <div class="form-group">
                        <label>출처</label>
                        <input type="text" th:field="*{source}"
                               placeholder="https://...">
                    </div>
 
                </div>
 
                <div class="form-section-title">구매 / 독서 기록</div>
                <div class="form-grid">
 
                    <div class="form-group">
                        <label>구매 시기</label>
                        <input type="text" th:field="*{purchasedAt}"
                               placeholder="예: 2024.04.01">
                    </div>
 
                    <div class="form-group">
                        <label>독서한 시기</label>
                        <input type="text" th:field="*{readAt}"
                               placeholder="예: 2024.04 — 2024.05">
                    </div>
 
                    <div class="form-group full">
                        <label>구매 계기 / 목적</label>
                        <textarea th:field="*{purpose}"
                                  placeholder="구매하거나 수집한 이유를 적어주세요"></textarea>
                    </div>
 
                </div>
 
                <div class="form-section-title"> + </div>
                <div class="form-grid">
 
                    <div class="form-group full">
                        <label>한 줄 감상</label>
                        <input type="text" th:field="*{memo}"
                               placeholder="핵심 인상을 한 문장으로">
                    </div>
 
                    <div class="form-group full">
                        <label>추가 정보</label>
                        <textarea th:field="*{extraInfo}"
                                  placeholder="ISBN, 페이지 수 등"></textarea>
                    </div>
 
                </div>
            </div>
 
            <!-- 오른쪽 폼 -->
            <div style="display:flex; flex-direction:column; gap:12px;">
                <!-- 태그 -->
                <div class="card" style="margin-bottom:0;">
                    <div class="card-title">태그</div>
                    <div class="tag-list" id="selectedTags"
                         style="margin-bottom:10px; min-height:24px;">
                        <th:block th:each="tag : ${tags}" th:if="${document.tagIds != null and document.tagIds.contains(tag.id)}">
                            <span class="badge badge-blue" style="cursor:pointer;" onclick="removeSelectedTag(this)">
                                <span th:text="${tag.name} + ' x'"></span>
                                <input type="hidden" name="tagIds" th:value="${tag.id}">
                            </span>
                        </th:block>
                    </div>
                    <input type="text" id="tagSearch" placeholder="태그 검색 또는 추가..."
                           style="width:100%; padding:7px 10px; border:0.5px solid var(--border-medium); border-radius:var(--radius-md); background:var(--bg-primary); color:var(--text-primary); font-family:var(--font); font-size:13px; outline:none;"
                           onkeydown="if(event.key==='Enter'){event.preventDefault();addTagToDocument(event)}">
                    <div style="margin-top:8px; display:flex; flex-wrap:wrap; gap:5px;" id="tagSuggest">
                        <span th:each="tag : ${tags}"
                              th:if="${document.tagIds == null or !document.tagIds.contains(tag.id)}"
                              class="badge badge-gray"
                              style="cursor:pointer;"
                              th:text="${tag.name}"
                              th:attr="data-id=${tag.id}"
                              onclick="pickTag(this)">
                        </span>
                    </div>
                </div>
 
<!--                &lt;!&ndash; (리팩토링) 파일 첨부(하드코딩) &ndash;&gt;-->
<!--                <div class="card" style="margin-bottom:0;">-->
<!--                    <div class="card-title">파일 첨부</div>-->
<!--                    <div class="drop-zone" id="dropZone">-->
<!--                        <div class="drop-hint">파일을 이곳에 드래그하거나</div>-->
<!--                        <button type="button" class="act-btn"-->
<!--                                onclick="document.getElementById('fileInput').click()">-->
<!--                            파일 선택-->
<!--                        </button>-->
<!--                        <input type="file" id="fileInput" style="display:none;" multiple onchange="handleFiles(this.files)">-->
<!--                    </div>-->
<!--                    <div id="fileList" style="margin-top:8px;"></div>-->
<!--                    <div style="margin-top:6px; font-size:11px; color:var(&#45;&#45;text-tertiary);">PDF, EPUB, JPG, PNG 지원 · 최대 50MB</div>-->
<!--                </div>-->
 
                <!-- 파일 저장 위치/경로 -->
                <div class="card" style="margin-bottom:0;">
                    <div class="card-title">파일 저장 위치</div>
                    <input type="text" th:field="*{filePath}"
                           placeholder="/docs/books/2024/..." style="width:100%; padding:7px 10px; border:0.5px solid var(--border-medium); border-radius:var(--radius-md); background:var(--bg-primary); color:var(--text-primary); font-family:var(--font); font-size:13px; outline:none;">
                    <div style="margin-top:6px; font-size:11px; color:var(--text-tertiary);">
                        로컬 경로 또는 클라우드 경로 입력
                    </div>
                </div>
 
                <div style="display:flex; gap:8px;">
                    <a th:href="@{/documents}" class="btn-outline"
                       style="flex:1; text-align:center; padding:10px; text-decoration: none;">
                        취소
                    </a>
                    <button type="submit" class="btn-primary"
                            style="flex:1; padding:10px;"
                            th:text="${mode == 'register'} ? '등록 완료' : '수정 완료'">
                    </button>
                </div>
            </div>
 
        </div>
    </form>
</div>

<script th:src="@{/js/document-form.js}"></script>
</body>
</html>
